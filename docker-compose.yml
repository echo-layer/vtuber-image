version: '3'

services:
  master:
    image: chrislusf/seaweedfs
    ports:
      - 9333:9333
    command: "master -ip=master"
  volume:
    image: chrislusf/seaweedfs
    ports:
      - 8080:8080
    command: "volume -mserver=master:9333 -port=8080"
  s3:
    image: chrislusf/seaweedfs
    ports:
      - 8333:8333
    command: "s3 -master=master:9333"
