[package]
name = "vtuber-image"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
notify = "6.1"
uuid = { version = "1.0", features = ["v4"] }

[build-dependencies]
tonic-build = "0.11"
