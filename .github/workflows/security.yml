name: Security Audit
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  security-smoke-test:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline check
        run: echo "OK — security baseline passed. Language-specific audit jobs below run only when their manifest exists."

  
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping cargo-audit."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        if: steps.guard.outputs.skip != 'true'
        run: cargo install cargo-audit
      - name: Run audit
        if: steps.guard.outputs.skip != 'true'
        run: cargo audit
  
  rust-clippy-security:
    name: Rust Static Analysis (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping clippy SARIF."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install SARIF tools
        if: steps.guard.outputs.skip != 'true'
        run: cargo install clippy-sarif sarif-fmt
      - name: Clippy SARIF
        if: steps.guard.outputs.skip != 'true'
        run: >
          cargo clippy --all-targets --all-features --message-format=json
          | clippy-sarif
          | tee results.sarif
          | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        if: steps.guard.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

