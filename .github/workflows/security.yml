name: Security Audit
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  security-smoke-test:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline-secret scan
        run: |
          # Fail CI only if an obvious inline credential literal is committed.
          # This is a trip-wire, not a replacement for proper secret scanning.
          hit=0
          for pat in 'password\s*=\s*["'\''][^"'\'']{6,}' 'api[_-]?key\s*=\s*["'\''][^"'\'']{12,}' 'secret\s*=\s*["'\''][^"'\'']{6,}' 'token\s*=\s*["'\''][^"'\'']{20,}'; do
            if grep -rEi "$pat" \
              --include='*.md' --include='*.yml' --include='*.yaml' \
              --include='*.toml' --include='*.json' --include='*.rs' \
              --include='*.py' --include='*.ts' --include='*.tsx' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
              . 2>/dev/null; then
              hit=1
            fi
          done
          if [ "$hit" = "1" ]; then
            echo "::error::potential inline secret literal found — move it to vault/secret manager"
            exit 1
          fi
          echo "OK — no obvious inline credential literals."

  
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    if: hashFiles('**/Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit
  
  rust-clippy-security:
    name: Rust Static Analysis (SARIF)
    runs-on: ubuntu-latest
    if: hashFiles('**/Cargo.toml') != ''
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SARIF tools
        run: cargo install clippy-sarif sarif-fmt
      - name: Clippy SARIF
        run: >
          cargo clippy --all-targets --all-features --message-format=json
          | clippy-sarif
          | tee results.sarif
          | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

